version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    rebase-strategy: auto
    commit-message:
      prefix: deps
      prefix-development: deps(dev)
      include: scope
    groups:
      compatible-runtime-updates:
        dependency-type: production
        update-types: [minor, patch]
      compatible-development-updates:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
