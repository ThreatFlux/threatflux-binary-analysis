version: 2

multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: Etc/UTC
    commit-message:
      prefix: deps
      include: scope

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    cooldown:
      default-days: 7
    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    cooldown:
      default-days: 7
    rebase-strategy: auto
