name: Auto Release

concurrency:
  # Dry runs use their own group so they never cancel a real release.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
  queue: max

on:
  # workflow_run is required to release only after CI and Security pass on main.
  # The reusable workflow gates on a successful run from this repository (never
  # a fork) and executes no code from the triggering checkout.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

# Read-only by default; the release job below grants the reusable workflow
# only the write scopes it needs.
permissions:
  actions: read # The reusable workflow reads CI and Security run results.
  contents: read # Check out the target commit.
  pull-requests: read # Read the release pull request in release-PR mode.

jobs:
  version-floor:
    name: Verify automatic release version floor
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.dry_run || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.dry_run }}
        with:
          # Run the guard from the workflow revision, and inspect the candidate as Git data.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tested commit's manifest against unreleased changes
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid candidate SHA' >&2; exit 1; }
          tag="$(git tag --list 'v*' --sort=-version:refname | awk '
            /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found { print; found = 1 }
          ')"
          [[ -n "$tag" ]] || { echo 'No existing stable release tag' >&2; exit 1; }
          git merge-base --is-ancestor "$tag" "$TARGET_SHA"
          git show "${TARGET_SHA}:Cargo.toml" > "$RUNNER_TEMP/release-manifest.toml"
          git log --no-merges -z --format=%B "${tag}..${TARGET_SHA}" -- > "$RUNNER_TEMP/release-commits"
          python3 scripts/check_release_version.py "$tag" \
            "$RUNNER_TEMP/release-manifest.toml" "$RUNNER_TEMP/release-commits"

  release:
    needs: version-floor
    permissions:
      actions: write # Dispatches release.yml if a release falls back to GITHUB_TOKEN.
      contents: write # Pushes the release proposal branch and tag, and creates the GitHub Release.
      pull-requests: write # Required by the reusable workflow's release-PR mode.
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@f4d48290988681cfbf3e03f47e312a79b322ccc8  # v0.7.12
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      create-pr: true
      required-workflows: CI,Security
      # The ThreatFlux automation GitHub App pushes the release tag, which
      # starts release.yml through its `push: tags` trigger, so the reusable
      # workflow dispatches nothing on that path (dispatch-on-app-token stays
      # false, so release.yml never runs twice). release.yml is dispatched with
      # the version input only if a release falls back to GITHUB_TOKEN, whose
      # tag pushes start no workflows.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
