name: Auto Release

concurrency:
  # Dry runs use their own group so they never cancel a real release.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

on:
  # workflow_run is required to release only after CI and Security pass on main.
  # The reusable workflow gates on a successful run from this repository (never
  # a fork) and executes no code from the triggering checkout.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

# Read-only by default; the release job below grants the reusable workflow
# only the write scopes it needs.
permissions:
  actions: read # The reusable workflow reads CI and Security run results.
  contents: read # Check out the target commit.
  pull-requests: read # Read the release pull request in release-PR mode.

jobs:
  release:
    permissions:
      actions: write # Dispatches release.yml if a release falls back to GITHUB_TOKEN.
      contents: write # Pushes the version commit and tag, and creates the GitHub Release.
      pull-requests: write # Required by the reusable workflow's release-PR mode.
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@eb9f3cf78c3899be0c4c9323d5cc86de5e1fdee8 # v0.7.7
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      # The ThreatFlux automation GitHub App pushes the release tag, which
      # starts release.yml through its `push: tags` trigger, so the reusable
      # workflow dispatches nothing on that path (dispatch-on-app-token stays
      # false, so release.yml never runs twice). release.yml is dispatched with
      # the version input only if a release falls back to GITHUB_TOKEN, whose
      # tag pushes start no workflows.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
