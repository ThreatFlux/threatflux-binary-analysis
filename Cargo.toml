[workspace]
resolver = "3"

[package]
name = "threatflux-binary-analysis"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["ThreatFlux"]
description = "Parsing and analysis primitives for ELF, PE, Mach-O, Java, and WebAssembly binaries"
license = "MIT"
repository = "https://github.com/ThreatFlux/threatflux-binary-analysis"
homepage = "https://github.com/ThreatFlux/threatflux-binary-analysis"
documentation = "https://docs.rs/threatflux-binary-analysis"
keywords = ["binary", "analysis", "disassembly", "security", "reverse-engineering"]
categories = ["parsing", "development-tools"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/**/*.md",
    "Cargo.toml",
    "README.md",
    "API.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "DEVELOPMENT.md",
    "LICENSE",
    "SECURITY.md",
    "TESTING.md",
    "docs/**/*.md",
]

# Binary format support
[features]
default = ["elf", "pe", "macho", "java"]
elf = ["dep:goblin", "goblin/elf32", "goblin/elf64", "goblin/std", "goblin/endian_fd"]
pe = ["dep:goblin", "goblin/pe32", "goblin/pe64", "goblin/std", "goblin/endian_fd"]
macho = ["dep:goblin", "goblin/mach32", "goblin/mach64", "goblin/std", "goblin/endian_fd"]
java = ["dep:zip"]
wasm = ["dep:wasmparser"]
# Disassembly engines
disasm-capstone = ["dep:capstone"]
disasm-iced = ["dep:iced-x86"]
# Analysis features
control-flow = ["dep:petgraph", "disasm-capstone"]
entropy-analysis = []
symbol-resolution = ["dep:gimli", "dep:addr2line"]
# Optional features
compression = ["dep:flate2"]
visualization = []
serde-support = ["dep:serde", "dep:serde_json"]

[dependencies]
# Core dependencies
thiserror = "2.0"

# Binary parsing
goblin = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
memmap2 = "0.9"

# Disassembly engines (optional)
capstone = { version = "0.13", default-features = false, features = ["full", "std"], optional = true }
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "instr_info", "nasm", "std"], optional = true }

# WASM support (optional)
wasmparser = { version = "0.236", default-features = false, features = ["std", "validate"], optional = true }

# Control flow analysis (optional)
petgraph = { version = "0.6", default-features = false, features = ["graphmap"], optional = true }

# Symbol resolution (optional)
gimli = { version = "0.31", optional = true }
addr2line = { version = "0.24", optional = true }

# Utilities (optional)
flate2 = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3.0"
proptest = "1.0"
# Testing utilities
rstest = "0.26"
pretty_assertions = "1.4"
wat = "1.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[example]]
name = "basic_analysis"
path = "examples/basic_analysis.rs"

[[example]]
name = "control_flow"
path = "examples/control_flow.rs"
required-features = ["control-flow"]

[[example]]
name = "disassembly"
path = "examples/disassembly.rs"
required-features = ["disasm-capstone"]
